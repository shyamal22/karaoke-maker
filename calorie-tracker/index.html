<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>KCAL — Calorie Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KCAL">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">KCAL<span class="brand-sub">■ CALORIE TRACKER</span></div>
  <button class="btn btn-small" id="btn-settings" aria-label="Settings">⚙ SET</button>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" data-tab="log" role="tab">LOG</button>
  <button class="tab" data-tab="weight" role="tab">WEIGHT</button>
</nav>

<!-- ============ LOG TAB ============ -->
<main id="tab-log" class="tabpanel">

  <section class="datebar">
    <button class="btn btn-small" id="date-prev" aria-label="Previous day">◀</button>
    <button class="datebar-label" id="date-label">TODAY</button>
    <button class="btn btn-small" id="date-next" aria-label="Next day">▶</button>
  </section>

  <section class="summary card">
    <div class="summary-main">
      <div class="stat">
        <div class="stat-num" id="sum-eaten">0</div>
        <div class="stat-label">EATEN</div>
      </div>
      <div class="stat-op">/</div>
      <div class="stat">
        <div class="stat-num" id="sum-goal">2000</div>
        <div class="stat-label">GOAL</div>
      </div>
      <div class="stat stat-right">
        <div class="stat-num" id="sum-left">2000</div>
        <div class="stat-label" id="sum-left-label">LEFT</div>
      </div>
    </div>
    <div class="meter" aria-hidden="true"><div class="meter-fill" id="meter-fill"></div></div>
    <div class="macros">
      <span>PROTEIN <b id="mac-p">0</b>g</span>
      <span>CARBS <b id="mac-c">0</b>g</span>
      <span>FAT <b id="mac-f">0</b>g</span>
    </div>
  </section>

  <section class="addbox card">
    <div class="addbox-row">
      <input type="search" id="food-search" placeholder="SEARCH FOOD… (thepla, dal, roti)" autocomplete="off">
      <button class="btn" id="btn-quickadd" title="Quick add calories">+KCAL</button>
    </div>
    <div id="search-results" class="results" hidden></div>
    <div id="freq-foods" class="freq"></div>
  </section>

  <section id="meals"></section>

</main>

<!-- ============ WEIGHT TAB ============ -->
<main id="tab-weight" class="tabpanel" hidden>
  <section class="card">
    <div class="section-title">BODY WEIGHT</div>
    <div class="weight-add">
      <input type="number" id="weight-input" inputmode="decimal" step="any" min="0" placeholder="0.0">
      <span class="weight-unit">KG</span>
      <button class="btn" id="btn-weight-save">LOG IT</button>
    </div>
    <div class="weight-stats" id="weight-stats"></div>
  </section>

  <section class="card">
    <div class="section-title">TREND <span class="section-note" id="chart-range-note"></span></div>
    <div id="weight-chart" class="chart"></div>
    <div id="weight-tip" class="chart-tip" hidden></div>
  </section>

  <section class="card">
    <div class="section-title">HISTORY</div>
    <div id="weight-history"></div>
  </section>
</main>

<!-- ============ DIALOGS ============ -->
<dialog id="dlg-portion">
  <form method="dialog" class="dlg">
    <div class="dlg-title" id="portion-name">FOOD</div>
    <div class="dlg-sub" id="portion-serving"></div>
    <div class="dlg-row">
      <label>SERVINGS</label>
      <div class="qty-btns">
        <button type="button" class="btn btn-small qty" data-q="0.5">½</button>
        <button type="button" class="btn btn-small qty" data-q="1">1</button>
        <button type="button" class="btn btn-small qty" data-q="1.5">1½</button>
        <button type="button" class="btn btn-small qty" data-q="2">2</button>
        <button type="button" class="btn btn-small qty" data-q="3">3</button>
      </div>
      <input type="number" id="portion-qty" step="any" min="0" value="1" inputmode="decimal">
    </div>
    <div class="dlg-row">
      <label>MEAL</label>
      <div class="meal-btns" id="portion-meals"></div>
    </div>
    <div class="dlg-kcal" id="portion-kcal">0 KCAL</div>
    <div class="dlg-actions">
      <button value="cancel" formnovalidate class="btn btn-ghost">CANCEL</button>
      <button value="ok" class="btn btn-primary" id="portion-ok">ADD</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-quick">
  <form method="dialog" class="dlg">
    <div class="dlg-title">QUICK ADD</div>
    <div class="dlg-row">
      <label>NAME (OPTIONAL)</label>
      <input type="text" id="quick-name" placeholder="e.g. Wedding thali">
    </div>
    <div class="dlg-row">
      <label>KCAL</label>
      <input type="number" id="quick-kcal" inputmode="numeric" min="0" step="any" placeholder="0">
    </div>
    <div class="dlg-row">
      <label>MEAL</label>
      <div class="meal-btns" id="quick-meals"></div>
    </div>
    <label class="dlg-check"><input type="checkbox" id="quick-save"> SAVE AS MY FOOD</label>
    <div class="dlg-actions">
      <button value="cancel" formnovalidate class="btn btn-ghost">CANCEL</button>
      <button value="ok" class="btn btn-primary" id="quick-ok">ADD</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-settings">
  <form method="dialog" class="dlg">
    <div class="dlg-title">SETTINGS</div>
    <div class="dlg-row">
      <label>DAILY CALORIE GOAL</label>
      <input type="number" id="set-goal" inputmode="numeric" min="0" step="any">
    </div>
    <div class="dlg-row">
      <label>GOAL WEIGHT (KG, OPTIONAL)</label>
      <input type="number" id="set-goal-weight" inputmode="decimal" min="0" step="any" placeholder="—">
    </div>
    <div class="dlg-row">
      <label>DATA</label>
      <div class="dlg-btnrow">
        <button type="button" class="btn btn-small" id="btn-export">EXPORT BACKUP</button>
        <button type="button" class="btn btn-small" id="btn-import">IMPORT</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </div>
      <div class="dlg-btnrow">
        <button type="button" class="btn btn-small btn-danger" id="btn-wipe">ERASE EVERYTHING</button>
      </div>
    </div>
    <div class="dlg-note" id="db-count"></div>
    <div class="dlg-actions">
      <button value="ok" class="btn btn-primary">DONE</button>
    </div>
  </form>
</dialog>

<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
