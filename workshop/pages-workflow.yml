# Copy this file to .github/workflows/pages.yml in the repository that holds
# the RCK Workshop app, then set Settings → Pages → Deploy from a branch → gh-pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -r --cached .github --quiet || true
          rm -rf .github
          touch .nojekyll
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force origin gh-pages
