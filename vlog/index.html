<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d0e">
<title>Daily Vlog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="topbar">
  <button id="backBtn" class="icon-btn" hidden aria-label="Back">&#8592;</button>
  <h1 id="title">Daily Vlog</h1>
  <button id="menuBtn" class="icon-btn" aria-label="Menu">&#8942;</button>
</header>

<nav id="menu" hidden>
  <button data-act="settings">Settings</button>
  <button data-act="export">Export backup</button>
  <button data-act="import">Import backup</button>
  <button data-act="storage">Storage used</button>
  <button data-act="about">About</button>
</nav>

<main id="view"></main>

<nav id="tabs">
  <button data-tab="today" class="on"><span>&#9679;</span>Today</button>
  <button data-tab="days"><span>&#9636;</span>Days</button>
  <button data-tab="journey"><span>&#9650;</span>Journey</button>
</nav>

<!-- hidden pickers: capture= goes straight to the camera, the others open the library -->
<input type="file" id="capPhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="capVideo" accept="video/*" capture="environment" hidden>
<input type="file" id="pickMedia" accept="image/*,video/*" multiple hidden>
<input type="file" id="pickMusic" accept="audio/*" hidden>
<input type="file" id="importFile" accept="application/json" hidden>

<div id="sheet" hidden><div id="sheetInner"></div></div>
<div id="toast" hidden></div>

<script src="compile.js"></script>
<script src="app.js"></script>
</body>
</html>
